# 舞台吊景越界彩排检测：前端 + API + 一次性 verify
# 宿主端口可用环境变量覆盖：WEB_PORT=8080 API_PORT=8000 docker compose up
services:
  api:
    build: ./api
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

  verify:
    build: ./verify
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      API_URL: http://api:8000
      WEB_URL: http://web:80
    restart: "no"
